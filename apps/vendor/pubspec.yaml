name: zopiq_vendor
description: "Zopiqnow for restaurants — the kitchen's side of an order."
publish_to: 'none'

version: 1.0.0+2
# Part of the zopiqnow pub workspace: shares the single root lockfile (Rule 3).
resolution: workspace

environment:
  sdk: ^3.12.2

# Almost every dependency here is one the customer app already pins, at the version
# the root lockfile already froze. The one exception is `image_picker`, an approved
# Rule 3 change request (2026-07-17): the vendor uploads dish and restaurant photos
# to Cloudinary, and picking an image off the device is the one thing Supabase does
# not do. Pinned exactly; the upload itself is an `http` multipart POST, no more deps.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.9

  # The same design system, so the two apps cannot drift into two brands.
  zopiq_ui:
    path: ../../packages/zopiq_ui

  flutter_riverpod: 2.6.1
  go_router: 14.8.1

  # The vendor's session, in the Keystore. Same reasoning as the customer app: a
  # refresh token in SharedPreferences is a refresh token in a plaintext file.
  flutter_secure_storage: 10.3.1

  supabase_flutter: 2.8.0

  # Native Google sign-in, so getting in does not depend on relaying a 6-digit
  # code out of a mailbox — which a Play reviewer cannot do, and which fails
  # whenever OTP mail is slow or rate-limited.
  #
  # **The same pinned version the customer app already carries.** This adds the
  # package to another app; it does not move anyone's version.
  google_sign_in: 7.2.0

  # Photo upload (approved 2026-07-17). Picks a dish/restaurant photo off the
  # device; the bytes go straight to Cloudinary, only the URL comes back.
  #
  # The code moved to `zopiq_uploads` when the rider app needed the same upload
  # for its delivery photo. These two stay declared here because this app's own
  # `Env` still supplies the cloud name and preset, and because moving a pin out
  # from under a Rule-3 approval is not something to do silently.
  image_picker: 1.1.2
  http: 1.6.0

  # The upload itself, shared with the rider app so the Cloudinary contract
  # cannot drift between them.
  zopiq_uploads:
    path: ../../packages/zopiq_uploads

  # Charts on the dashboard and earnings screens (approved Rule-3 change,
  # 2026-07-17, Phase 4/5). Pure Dart, no platform channels; its only transitive
  # dependency is `equatable`. Pinned exactly, like everything else here.
  fl_chart: 1.2.0

  # Push notifications (approved Rule-3 change, 2026-07-18, Phase 7). The kitchen
  # must hear a new order land whether the app is open on the counter or asleep in
  # a pocket. Firebase Cloud Messaging carries the wake; `flutter_local_notifications`
  # rings it — for a foreground order off the realtime stream, and for FCM messages
  # the system won't post itself. Vendor-only; the customer app takes none of this.
  # Pinned exactly.
  firebase_core: 3.8.1
  firebase_messaging: 15.1.6
  flutter_local_notifications: 18.0.1

  # --- Crash reporting (launch C3, audit OBS-001, 2026-08-02) -----------------
  # Added, not upgraded: the one crashlytics release that resolves against the
  # frozen `firebase_core: 3.8.1`, and it moved no other pin (Rule 3). Reports
  # Dart errors, fatal and handled both — see `core/observability/crash_reporter.dart`.
  firebase_crashlytics: 4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

flutter:
  # `firebase_messaging` and `flutter_local_notifications` are CocoaPods-only,
  # so SPM cannot resolve the graph. Pods for everything.
  config:
    enable-swift-package-manager: false

  uses-material-design: true
