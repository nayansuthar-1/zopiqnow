name: zopiq_rider
description: "Zopiqnow for delivery partners — the bike's side of an order."
publish_to: 'none'

version: 1.0.0+6
# Part of the zopiqnow pub workspace: shares the single root lockfile (Rule 3).
resolution: workspace

environment:
  sdk: ^3.12.2

# Every dependency here is one the customer or vendor app already pins, at the
# version the root lockfile already froze. **Not one new package**, and that is
# deliberate: a third app is a big enough change on its own without also being a
# reason to move a version (Rule 3). A rider needs a list and four text fields —
# nothing here needs a library the other two apps did not already earn.
#
# Notably absent: `firebase_messaging`. A rider does need waking when a job
# appears, and that is real work — but it belongs to a later slice, not to the
# one that has never yet run its own sign-in.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.9

  # The same design system as the other two apps, so all three read as one
  # company. The rider app is the one an outsider sees least, which is exactly
  # why it should not be left to drift into its own look.
  zopiq_ui:
    path: ../../packages/zopiq_ui

  # The legal corpus, shared with the other two apps. A rider sees the terms,
  # the privacy policy, their handbook and the verification policy — the five
  # documents that decide whether they can work and how they are paid.
  zopiq_legal:
    path: ../../packages/zopiq_legal

  # The delivery map, shared with the customer app (2026-07-28). Navigate opens
  # this rather than handing the rider to another app.
  zopiq_map:
    path: ../../packages/zopiq_map

  # The photo upload, shared with the vendor app (2026-08-04). A delivery now
  # carries a photograph of the handover, and this is the same Cloudinary path
  # the kitchen's two photos take. No new pin: `http` and `image_picker` were
  # already in the root lockfile for the vendor app.
  zopiq_uploads:
    path: ../../packages/zopiq_uploads

  flutter_riverpod: 2.6.1
  go_router: 14.8.1

  # The rider's session, in the Keystore. Same reasoning as the other two apps:
  # a refresh token in SharedPreferences is a refresh token in a plaintext file,
  # and this one opens a list of customers' addresses and phone numbers.
  flutter_secure_storage: 10.3.1

  supabase_flutter: 2.8.0

  # Native Google sign-in, so getting in does not depend on relaying a 6-digit
  # code out of a mailbox — which a Play reviewer cannot do, and which fails
  # whenever OTP mail is slow or rate-limited. A rider signing in at a kerb has
  # the same problem for the same reason.
  #
  # **The same pinned version the customer app already carries.** This adds the
  # package to another app; it does not move anyone's version.
  google_sign_in: 7.2.0

  # For the one thing a rider does that nobody else does: they go somewhere.
  # Until now the app showed an address and a phone number and left the rider to
  # retype both into other apps, at a kerb, holding a helmet.
  #
  # Approved by the user 2026-07-22. **Not actually a new package** — it has been
  # in the root lockfile all along as a transitive dependency of
  # `supabase_flutter`, which uses it for OAuth redirects. This only promotes it
  # to a direct dependency so the app may import it.
  #
  # Pinned at 6.3.2, the version the lockfile already froze. Writing 6.3.1 here
  # resolved cleanly and quietly *downgraded* the whole workspace — which is the
  # exact drift the freeze exists to catch.
  url_launcher: 6.3.2

  # --- The rider's own position (B3, 2026-07-28) ------------------------------
  # The one thing the customer's live map cannot be drawn without. Written on an
  # interval while the rider is carrying and deleted the moment they are not
  # (migration 0057).
  #
  # **Not a new package.** The customer app has pinned this since Step 5 and the
  # root lockfile already froze 14.0.3; this promotes it to a direct dependency
  # of the rider app at that same version. Not one new version resolves — the
  # same reasoning, and the same care, as `url_launcher` above.
  #
  # Inherits `flutter.minSdkVersion` (24), so the Android 10 floor is unaffected.
  geolocator: 14.0.3

  # --- Push notifications (B0, 2026-07-25) ------------------------------------
  # The one thing the rider pubspec's original note said was "absent... belongs
  # to a later slice" — this is that slice. The same three packages the vendor
  # already pins, at the versions the root lockfile already froze: **not one new
  # version** (Rule 3). Push is guarded end-to-end in `PushService.start`, so a
  # build with no `google-services.json` still runs — push is simply inert.
  firebase_core: 3.8.1
  firebase_messaging: 15.1.6
  flutter_local_notifications: 18.0.1

  # --- Crash reporting (launch C3, audit OBS-001, 2026-08-02) -----------------
  # Added, not upgraded: the one crashlytics release that resolves against the
  # frozen `firebase_core: 3.8.1`, and it moved no other pin (Rule 3). Reports
  # Dart errors, fatal and handled both — see `core/observability/crash_reporter.dart`.
  firebase_crashlytics: 4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

flutter:
  # `firebase_messaging` and `flutter_local_notifications` are CocoaPods-only,
  # so SPM cannot resolve the graph. Pods for everything.
  config:
    enable-swift-package-manager: false

  uses-material-design: true
