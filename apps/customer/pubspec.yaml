name: zopiqnow
description: "Zopiqnow premium food delivery and quick commerce app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+2

# Part of the zopiqnow pub workspace: shares the single root lockfile (Rule 3).
resolution: workspace

environment:
  sdk: ^3.12.2

# NOTE (Rule 3): after the first successful resolve these constraints are pinned
# to exact versions; the committed root pubspec.lock is authoritative. Never run
# `flutter pub upgrade` outside an approved upgrade task.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.9

  # Shared design system — Swiggy-grade tokens & theme (Rule 2).
  zopiq_ui:
    path: ../../packages/zopiq_ui

  # The delivery map: Ola's tiles, Ola's road, the layer switcher. In-repo, and
  # shared with the rider app so the two screens cannot drift apart.
  zopiq_map:
    path: ../../packages/zopiq_map

  # The live order card, drawn natively (P1 Tier 2). In-repo and Android-only;
  # adds no pub dependency and nothing to the lockfile. A package rather than
  # Kotlin in `android/app` because the card is drawn from the FCM background
  # isolate, and only real plugins reach that engine — see its pubspec.
  zopiq_live_card:
    path: ../../packages/zopiq_live_card

  # State management + DI (SAD 7.2 / 7.3).
  flutter_riverpod: 2.6.1

  # Declarative navigation (SAD 7.10).
  go_router: 14.8.1

  flutter_svg: ^2.0.10

  # --- Storage layer (approved Step 5, Rule 3 change request) -----------------
  # Auth tokens only. Android-side this is Keystore-backed EncryptedSharedPrefs
  # (SAD 7.6, 9.2: "token stored in secure storage"). Declares minSdk 23 — under
  # our floor of 24, so Rule 1 is unaffected.
  flutter_secure_storage: 10.3.1

  # Non-secret local state: selected address id, recent searches. Never tokens.
  shared_preferences: 2.5.5

  # --- Location (approved Step 5, Rule 3 change request) ----------------------
  # Coordinates only. Inherits flutter.minSdkVersion (24).
  geolocator: 14.0.3

  # Reverse-geocode via Android's *native* Geocoder — no Maps API key, no
  # billing. Google Places autocomplete (SAD 14) arrives with the backend.
  geocoding: 5.0.0

  # --- Payments (approved Step 6, Rule 3 change request, 2026-07-10) ----------
  # Razorpay checkout for UPI/cards. Declares minSdk 19 — under our floor of 24.
  # The checkout wiring itself lands with the backend (Step 7): opening the
  # gateway needs a key id and a server-created payment order.
  razorpay_flutter: 1.4.5

  # --- Backend (approved Step 7, Rule 3 change request, 2026-07-11) -----------
  # Supabase = Postgres + PostgREST + realtime. Chosen over Firestore because
  # the money rules (coupon minimums, discount caps, order state) belong in SQL
  # constraints and transactions, not in application code. Declares minSdk 21 —
  # under our floor of 24, so Rule 1 is unaffected.
  supabase_flutter: 2.8.0

  # --- Google Sign-In (approved Rule 3 change request, 2026-07-14) ------------
  # Native sign-in, not the browser OAuth flow: it returns an id token we hand
  # straight to `signInWithIdToken`, so the user never leaves the app and no
  # redirect/deep-link scheme is needed. Declares minSdk 21 — under our floor of
  # 24, so Rule 1 is unaffected.
  google_sign_in: 7.2.0

  # --- Push notifications (B0, 2026-07-25) ------------------------------------
  # The same three packages the vendor app already pins, at the versions the root
  # lockfile already froze — **not one new version** (Rule 3). FCM carries the
  # wake; `flutter_local_notifications` draws a foreground message Android would
  # otherwise swallow. Push is guarded end-to-end in `PushService.start`, so a
  # build with no `google-services.json` still runs — push is simply inert.
  firebase_core: 3.8.1
  firebase_messaging: 15.1.6
  flutter_local_notifications: 18.0.1

  # --- Crash reporting (launch C3, audit OBS-001, 2026-08-02) -----------------
  # Added, not upgraded. This is the crashlytics release that resolves against
  # the frozen `firebase_core: 3.8.1`, and adding it moved **no other pin** —
  # the root lockfile gained two entries and changed none (Rule 3).
  #
  # It reports Dart errors, fatal and handled both, and the handled half is the
  # point. The order-placement outage of 29 July — three days, every customer,
  # every cart — was a *caught* exception behind a generic snackbar. No crash
  # reporter would ever have seen it. `CrashReporter.recordHandled` is what
  # makes the next one visible on the day it starts rather than the day someone
  # complains.
  firebase_crashlytics: 4.2.0

  # --- Calling the rider and the restaurant (B5, 2026-07-29) ------------------
  # The dialler, and nothing else — see `core/dialler.dart` for why `tel:` opens
  # the keypad rather than placing the call. **Not a new version** (Rule 3): the
  # rider app has pinned 6.3.2 since 8g and the root lockfile already froze it,
  # so this moves the package from transitive to direct and changes no number.
  url_launcher: 6.3.2

  # --- The invoice, as a document (B6, 2026-07-29) ----------------------------
  # An **approved Rule 3 change request**: two genuinely new packages, and the
  # only way to hand somebody a tax invoice they can keep. `pdf` lays the page
  # out; `printing` opens the platform's own share/print sheet, which is what
  # turns "a screen" into "a file in Downloads or an email to an accountant".
  # Neither declares a minSdk above our floor of 24, so Rule 1 is unaffected.
  #
  # The alternative considered and rejected: a server-rendered HTML page behind
  # a signed URL. It needs no packages and it puts the document behind a network
  # round trip and a browser — a receipt should open when the phone is on a lift
  # with no signal, because that is usually where somebody checks one.
  pdf: 3.11.3
  printing: 5.14.2

  # --- The customer's own photo (2026-07-30) ----------------------------------
  # **Not new versions** (Rule 3): the vendor app has pinned both since its Phase
  # 1 and this is a single-lockfile workspace, so `pubspec.lock` already resolved
  # image_picker at 1.1.2 and http at 1.6.0. This moves them from transitive to
  # direct for this app and changes no number — the same move `url_launcher` made
  # in B5. Neither declares a minSdk above our floor of 24.
  #
  # `image_picker` because a profile picture has to come off the phone somehow;
  # `http` because the upload is a multipart POST to Cloudinary and Supabase's
  # client cannot make one. On Android 13+ the gallery path goes through the
  # system Photo Picker, which needs no storage permission at all.
  image_picker: 1.1.2
  http: 1.6.0

  # --- The hero plays its own video (migration 0072, 2026-07-30) ---------------
  # An **approved Rule 3 change request**, and the one the 0054 hero loop was
  # written specifically to avoid. That design transcoded the admin's clip to an
  # animated WebP so `Image.network` could decode it and nothing here had to move;
  # it cost `w_720,fps_12`, because animated WebP has no interframe compression
  # and every frame is a separate still image.
  #
  # The measurements are what reversed the decision. Eight seconds of the same
  # clip: the old 720p twelve-frame WebP is 1,137,876 bytes, and a silent h.264
  # MP4 at the source resolution and the source frame rate is 599,018. Full
  # quality is **half the size** of the compromise, so the no-dependency route was
  # not a cheap way to get motion — it was an expensive way to get bad motion.
  #
  # Resolves at the version below without moving a single existing pin (checked
  # with `flutter pub add --dry-run`, and the lockfile diff is 40 added lines and
  # no removed ones: five new packages, nothing else touched).
  #
  # **minSdk, and it is worth reading.** `video_player_android` is
  # ExoPlayer/media3 and declares `minSdk = 24` — not *under* our floor of 24 like
  # every other package here, but exactly *on* it. Rule 1 (Android 10 → latest) is
  # unaffected and the build is fine, but this is the first dependency that would
  # break the moment the floor moved down, so the floor is now load-bearing rather
  # than a preference.
  video_player: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Six of this app's plugins ship CocoaPods podspecs only, so Swift Package
  # Manager cannot resolve the whole graph -- `firebase_core` via SPM beside
  # `firebase_messaging` via CocoaPods is a hard conflict. Pods for everything.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Dish-category artwork for the Home rail. OpenMoji (CC BY-SA 4.0) — see
  # ATTRIBUTIONS.md. Stand-ins until commissioned illustrations are ready.
  assets:
    - assets/categories/
    - assets/icons_zopiq/
    - assets/icons-2.0/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
