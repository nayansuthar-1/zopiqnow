group 'com.siteonlab.zopiq_live_card'
version '1.0'

// Deliberately no `buildscript { classpath 'com.android.tools.build:gradle:X' }`
// block. Pinning an AGP here is what most pub plugins do and it is exactly the
// version-freeze collision we are avoiding: the app's settings.gradle.kts
// already puts AGP 9.0.1 and Kotlin 2.3.20 on the build classpath, and this
// module inherits them. Nothing in this package names a dependency version.
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.siteonlab.zopiq_live_card'

    // Pinned to the app's value rather than `flutter.compileSdkVersion`, because
    // the Android 16 branch references `Notification.ProgressStyle` and will not
    // compile against anything lower. Matches apps/customer/android/app/build.gradle.kts.
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        // The app's floor (Android 7.0). Every API used below API 36 exists here.
        minSdkVersion 24
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

// No `dependencies` block, and that is the point. This module uses the framework
// `android.app.Notification` builder rather than `NotificationCompat`, so it adds
// no androidx artifact, no Kotlin stdlib, and nothing to the lockfile.
