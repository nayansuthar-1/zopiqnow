name: zopiq_ui
description: "Zopiqnow design system — Swiggy-grade design tokens, theming, and shared UI components. Single source of truth for color, spacing, radii, typography, and elevation (Rule 2)."
version: 0.1.0
publish_to: "none"

# Part of the workspace: shares the root lockfile.
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.5"

dependencies:
  flutter:
    sdk: flutter

  # --- The disk image cache (ZOMATO_PARITY B8 perf, 2026-08-09) ---------------
  # **Not new versions** (Rule 3). Both were already resolved in the root
  # lockfile as transitive dependencies at exactly these numbers; this is the
  # transitive-to-direct move `url_launcher` made in B5 and `http` made for the
  # profile upload, and it changes no pin. Neither declares a minSdk above our
  # floor of 24.
  #
  # `path_provider` for the OS cache directory — the one thing `dart:io` cannot
  # answer on its own, because only the platform knows where a cache belongs.
  # `crypto` to name a file after its URL; a hand-rolled hash here would be more
  # code and less proven.
  crypto: 3.0.7
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  # Brand face. Figtree is a variable font (wght 300–900) — one file covers every
  # weight; ZopiqTypography selects them via FontVariation.
  # Licensed under the SIL Open Font License (see assets/fonts/OFL.txt).
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Variable.ttf
