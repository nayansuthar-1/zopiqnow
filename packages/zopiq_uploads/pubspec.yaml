name: zopiq_uploads
description: "The photo upload, once. Picks an image off the camera or the gallery and puts it on Cloudinary through the unsigned preset — shared by the vendor's dish editor and the two proof-of-delivery flows."
version: 0.1.0
publish_to: "none"

# Part of the workspace: shares the root lockfile.
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.5"

dependencies:
  flutter:
    sdk: flutter

  # Both already resolved in the root lockfile at these exact versions for the
  # vendor app, which is where this code came from. Naming them here adds a
  # member to the workspace, not a version to the lockfile (Rule 3) — after this
  # lands, `pubspec.lock` must be byte-identical.
  http: 1.6.0
  image_picker: 1.1.2

  # The design tokens, so a proof photo tile is the same orange, the same radii
  # and the same muted grey as everything else. No cycle: zopiq_ui depends on
  # nothing but Flutter.
  zopiq_ui:
    path: ../zopiq_ui

dev_dependencies:
  flutter_lints: 6.0.0

# --- Why a package of its own -----------------------------------------------
# `zopiq_ui` is the design system and its only dependency is Flutter itself;
# putting a platform plugin in it would make every app that wants a button also
# ship a gallery picker. The customer app has no upload and should not carry one.
#
# The alternative was a second copy in the rider app. Two copies of an upload
# would be two copies of the Cloudinary contract — the cloud name, the preset
# name, the multipart field names, and the `secure_url` the response is read
# from. A drifting copy of that is a silent bug: uploads keep succeeding against
# the wrong preset. So it lives once, and the two apps that need it depend on it.
#
# Neither app's `Env` is imported here. The cloud name and preset arrive through
# the constructor, so this package holds no configuration of its own and cannot
# disagree with the app that uses it.
