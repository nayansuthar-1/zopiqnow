name: zopiq_map
description: "The map, once. A Google map with Ola's route on it, the layer switcher, and the pins — shared by the customer's tracking screen and the rider's navigation screen."
version: 0.1.0
publish_to: "none"

# Part of the workspace: shares the root lockfile.
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.5"

dependencies:
  flutter:
    sdk: flutter

  # --- The basemap (approved 2026-07-29, Rule 3 change request) ---------------
  # Only the picture underneath comes from Google. The route is still measured by
  # Ola (migrations 0046/0057/0059) and the rider's position is still Supabase
  # realtime; neither ever touched a tile server.
  #
  # This replaced Ola's own vector tiles for one reason, and it is a hard one:
  # Ola throttles its tiles product to **20 requests a minute**, account-wide
  # across styles, tiles and glyphs. A single vector map screen needs 40-80, so
  # the basemap blanked on first load and stayed blank while panning. Google's
  # mobile map loads are unmetered and free, so the ceiling disappears entirely.
  #
  # It also fixes satellite. Ola's imagery stops at zoom 14 — fields and village
  # outlines; Google's runs to zoom 20, which is the zoom a rider actually needs
  # to find a gate.
  #
  # Declares minSdk 21, under our floor of 24, so Rule 1 is unaffected.
  google_maps_flutter: 2.18.0

  # The design tokens, so a map's controls are the same orange as everything
  # else. No cycle: zopiq_ui does not depend on this.
  zopiq_ui:
    path: ../zopiq_ui

dev_dependencies:
  flutter_lints: 6.0.0

# --- Why a package of its own, and not `zopiq_ui` ----------------------------
# `zopiq_ui` is the design system and its only dependency is Flutter itself.
# Putting a heavy platform plugin in it would make every app that wants a button
# also ship the Maps SDK — the vendor app has no map and should not carry one.
# Two apps need this; they are the two that depend on it.
