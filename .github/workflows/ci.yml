# Zopiqnow CI — analyze and test, on every push and pull request.
#
# Why this file exists (audit ARC-002 / QA-002). Nothing ran the 39 test files
# in this repository, and by 2026-07-30 twenty-seven of them were failing. Not
# for one reason: the offers strip made a coupon finder ambiguous, migration
# 0050 removed a button a vendor test still pressed, B3 put a map page in front
# of the rider's navigation hand-off, and the receipt redesign renamed "Total".
# Each was a deliberate product change, each silently invalidated a test, and
# nobody found out — because finding out required someone to remember to run
# `flutter test` in three directories.
#
# The suite is green as of 2026-07-30. This job is what keeps it that way; the
# fixes without it would rot again within a phase or two.
#
# Deliberately NOT here yet:
#   * pgTAP over the money layer (QA-001). It is the coverage that actually
#     matters — `place_order`, `validate_coupon`, the settlement and payout
#     rollups — and it does not exist to run. When it does, it belongs in a job
#     beside this one, against a Postgres service container.
#   * A from-zero migration apply (DAT-006). Worth having, but the migrations
#     reference Supabase's own schemas (`auth`, `storage`, `supabase_functions`),
#     so a bare `postgres:15` service will not do — it needs `supabase start`,
#     and that needs Docker on the runner. A follow-up, not a stub.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to .fvmrc, and pinned on purpose — ENGINEERING_RULES.md Rule 3
          # freezes the toolchain, and a CI job that silently tracked stable
          # would be the one place the freeze did not hold. Update both together
          # or neither.
          flutter-version: 3.44.5
          channel: stable
          cache: true

      # One resolve for the whole workspace. `pubspec.lock` at the root is
      # authoritative (Rule 3), so this must not be `pub upgrade` — and
      # `--enforce-lockfile` makes a drifted lockfile a failure here rather than
      # a surprise on somebody's machine.
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      # Errors fail the build; warnings and infos do not, and **the flags are
      # what make that true**.
      #
      # This step used to be a bare `flutter analyze apps packages` under a
      # comment asserting that only errors failed it. That was never so:
      # `flutter analyze` exits non-zero on warnings *and* infos by default, so
      # from the day this file landed the job failed on every single push, for
      # 27 pre-existing issues and not one error. A red pipeline nobody can make
      # green is a pipeline people stop reading, which is worse than no
      # pipeline — it was mailing failure notices for a week while the suites
      # were green the whole time. Fixed 2026-08-03.
      #
      # The backlog it was tripping over is real but not urgent: 12 warnings
      # (unused declarations and fields left by the receipt, earnings and gifts
      # redesigns; one unused import) and 15 infos (`prefer_const`, `withOpacity`
      # deprecations, one `unawaited_futures`). None of it is a defect. Clearing
      # it and dropping `--no-fatal-warnings` is the right follow-up, in that
      # order — the flag is the honest description of today's bar, not an
      # excuse to let the count climb.
      - name: Analyze
        run: flutter analyze apps packages --no-fatal-warnings --no-fatal-infos

      # Per package, so a failure names the app it belongs to rather than
      # arriving as one undifferentiated wall.
      - name: Test — customer
        run: flutter test
        working-directory: apps/customer

      - name: Test — vendor
        run: flutter test
        working-directory: apps/vendor

      - name: Test — rider
        run: flutter test
        working-directory: apps/rider

      - name: Test — zopiq_ui
        run: flutter test
        working-directory: packages/zopiq_ui
